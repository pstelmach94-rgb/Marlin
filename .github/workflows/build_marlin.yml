name: Build Marlin Firmware

# Workflow odpala się przy push do main i ręcznie
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Marlin

    steps:
    # 1️⃣ Pobranie repozytorium
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Ustawienie Pythona potrzebnego do PlatformIO
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3️⃣ Instalacja PlatformIO
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    # 4️⃣ Budowanie firmware dla STM32F103Rx_creality
    - name: Build firmware
      run: pio run -e STM32F103Rx_creality

    # 5️⃣ Upload pliku firmware.bin jako artefaktu
    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/STM32F103Rx_creality/firmware.bin
